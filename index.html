<form id="bookingForm" class="booking-form">
  <label>
    Full Name
    <input type="text" name="full_name" required />
  </label>

  <label>
    Email Address
    <input type="email" name="email" required />
  </label>

  <label>
    Phone Number
    <input type="tel" name="phone" required />
  </label>

  <label>
    Service Address
    <input type="text" name="address" required />
  </label>

  <label>
    Requested Date
    <input type="date" name="requested_date" required />
  </label>

  <label>
    Services Needed
    <textarea
      name="services"
      rows="4"
      placeholder="Mowing, edging, trimming, cleanup, etc."
      required
    ></textarea>
  </label>

  <label>
    Additional Notes
    <textarea
      name="notes"
      rows="3"
      placeholder="Gate code, pets, special instructions, etc."
    ></textarea>
  </label>

  <button type="submit" class="btn">Submit Booking Request</button>
  <p id="formMessage" style="margin-top: 10px; font-weight: bold;"></p>
</form>
